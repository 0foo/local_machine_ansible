- name: Configure SSH on Debian-based systems
  hosts: debian
  become: true

  tasks:
  - name: Enable systemd linger (keeps user's ssh-agent socket alive between SSH sessions)
    command: "loginctl enable-linger {{ ansible_facts['user_id'] }}"
    args:
      creates: "/var/lib/systemd/linger/{{ ansible_facts['user_id'] }}"
